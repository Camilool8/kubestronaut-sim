apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: cka-mock-01
  title: CKA Mock Exam
  certification: CKA
  description: >-
    Administrator-track exercises across the full CKA curriculum:
    troubleshooting, cluster architecture and installation, services
    and networking with Gateway API, workloads and scheduling, and
    storage. Five-node cluster with root ssh to every node, plus
    per-question auxiliary clusters for the disruptive tasks.
spec:
  examType: hands-on
  duration: 120m
  passingScore: 66
  kubernetesVersion: "1.35"
  examLength: 16
  domainWeights:
    Troubleshooting: 30
    Cluster Architecture, Installation and Configuration: 25
    Services and Networking: 20
    Workloads and Scheduling: 15
    Storage: 10
  difficultyMix:
    quick: 25
    core: 50
    deep: 25
  environment:
    provider: kind
    nodes: 5
    addons: [gateway-api]
    allowedDomains: [kubernetes.io, helm.sh, gateway-api.sigs.k8s.io, code.jquery.com, fonts.googleapis.com, fonts.gstatic.com, algolia.net, algolianet.com]
  instances:
    - name: instance-1
    - name: instance-2
  questions:
    - id: q01
      title: Deployment that never becomes ready
      instance: instance-1
      domain: Troubleshooting
      weight: 9
      targetSeconds: 390
      difficulty: core
      docs:
        - label: Deployments
          url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
        - label: Configure liveness, readiness and startup probes
          url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    - id: q02
      title: CrashLoopBackOff triage
      instance: instance-2
      domain: Troubleshooting
      weight: 8
      targetSeconds: 390
      difficulty: core
      docs:
        - label: Debug running Pods
          url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
        - label: ConfigMaps
          url: https://kubernetes.io/docs/concepts/configuration/configmap/
    - id: q03
      title: Service with no endpoints
      instance: instance-1
      domain: Troubleshooting
      weight: 8
      targetSeconds: 360
      difficulty: core
      docs:
        - label: Services
          url: https://kubernetes.io/docs/concepts/services-networking/service/
        - label: Debug Services
          url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
    - id: q04
      title: Pods cannot resolve an internal zone
      instance: instance-2
      domain: Troubleshooting
      weight: 10
      targetSeconds: 630
      difficulty: deep
      docs:
        - label: DNS for Services and Pods
          url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
        - label: Customizing DNS Service
          url: https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/
    - id: q05
      title: Repair the aux cluster's scheduler
      instance: instance-1
      domain: Troubleshooting
      weight: 9
      targetSeconds: 510
      difficulty: core
      docs:
        - label: Create static Pods
          url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/
        - label: Troubleshooting clusters
          url: https://kubernetes.io/docs/tasks/debug/debug-cluster/
    - id: q06
      title: Drain a worker for maintenance
      instance: instance-2
      domain: Troubleshooting
      weight: 6
      targetSeconds: 210
      difficulty: quick
      docs:
        - label: Safely drain a node
          url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
    - id: q07
      title: Fix the NotReady node
      instance: instance-1
      domain: Troubleshooting
      weight: 10
      targetSeconds: 660
      difficulty: deep
      docs:
        - label: Troubleshooting clusters
          url: https://kubernetes.io/docs/tasks/debug/debug-cluster/
        - label: Nodes
          url: https://kubernetes.io/docs/concepts/architecture/nodes/
    - id: q08
      title: RBAC for a CI ServiceAccount
      instance: instance-2
      domain: Cluster Architecture, Installation and Configuration
      weight: 8
      targetSeconds: 420
      difficulty: core
      docs:
        - label: RBAC authorization
          url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        - label: Checking API access
          url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
    - id: q09
      title: Helm release management
      instance: instance-1
      domain: Cluster Architecture, Installation and Configuration
      weight: 8
      targetSeconds: 450
      difficulty: core
      docs:
        - label: Using Helm
          url: https://helm.sh/docs/intro/using_helm/
        - label: Helm template
          url: https://helm.sh/docs/helm/helm_template/
    - id: q10
      title: Kustomize overlay
      instance: instance-2
      domain: Cluster Architecture, Installation and Configuration
      weight: 7
      targetSeconds: 390
      difficulty: core
      docs:
        - label: Declarative management with Kustomize
          url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
    - id: q11
      title: CRDs and a custom resource
      instance: instance-1
      domain: Cluster Architecture, Installation and Configuration
      weight: 6
      targetSeconds: 210
      difficulty: quick
      docs:
        - label: Custom resources
          url: https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
        - label: CustomResourceDefinitions
          url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
    - id: q12
      title: Install a CNI on the aux cluster
      instance: instance-2
      domain: Cluster Architecture, Installation and Configuration
      weight: 7
      targetSeconds: 510
      difficulty: core
      docs:
        - label: Network plugins
          url: https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
        - label: Cluster networking
          url: https://kubernetes.io/docs/concepts/cluster-administration/networking/
    - id: q13
      title: kubeadm upgrade on the aux cluster
      instance: instance-1
      domain: Cluster Architecture, Installation and Configuration
      weight: 9
      targetSeconds: 780
      difficulty: deep
      docs:
        - label: Upgrading kubeadm clusters
          url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
    - id: q14
      title: Expose via Gateway
      instance: instance-2
      domain: Services and Networking
      weight: 8
      targetSeconds: 450
      difficulty: core
      docs:
        - label: Gateway API
          url: https://kubernetes.io/docs/concepts/services-networking/gateway/
        - label: HTTPRoute
          url: https://gateway-api.sigs.k8s.io/api-types/httproute/
    - id: q15
      title: Ingress → Gateway migration
      instance: instance-1
      domain: Services and Networking
      weight: 10
      targetSeconds: 690
      difficulty: deep
      docs:
        - label: Migrating from Ingress
          url: https://gateway-api.sigs.k8s.io/guides/migrating-from-ingress/
        - label: TLS configuration
          url: https://gateway-api.sigs.k8s.io/guides/tls/
    - id: q16
      title: Least-privilege NetworkPolicy
      instance: instance-2
      domain: Services and Networking
      weight: 9
      targetSeconds: 660
      difficulty: deep
      docs:
        - label: Network policies
          url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    - id: q17
      title: NodePort with a named port
      instance: instance-1
      domain: Services and Networking
      weight: 6
      targetSeconds: 210
      difficulty: quick
      docs:
        - label: Service types
          url: https://kubernetes.io/docs/concepts/services-networking/service/
    - id: q18
      title: Multi-path Ingress
      instance: instance-2
      domain: Services and Networking
      weight: 7
      targetSeconds: 360
      difficulty: core
      docs:
        - label: Ingress
          url: https://kubernetes.io/docs/concepts/services-networking/ingress/
    - id: q19
      title: Sidecar log shipper
      instance: instance-1
      domain: Workloads and Scheduling
      weight: 9
      targetSeconds: 450
      difficulty: core
      docs:
        - label: Sidecar containers
          url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
    - id: q20
      title: Autoscale the API
      instance: instance-2
      domain: Workloads and Scheduling
      weight: 6
      targetSeconds: 180
      difficulty: quick
      docs:
        - label: Horizontal Pod Autoscaling
          url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
        - label: HorizontalPodAutoscaler walkthrough
          url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/
    - id: q21
      title: Dedicated batch node
      instance: instance-1
      domain: Workloads and Scheduling
      weight: 8
      targetSeconds: 420
      difficulty: core
      docs:
        - label: Taints and tolerations
          url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
        - label: Assigning Pods to nodes
          url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    - id: q22
      title: PriorityClass rollout
      instance: instance-2
      domain: Workloads and Scheduling
      weight: 7
      targetSeconds: 240
      difficulty: quick
      docs:
        - label: Pod priority and preemption
          url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
        - label: Deployments
          url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - id: q23
      title: WaitForFirstConsumer
      instance: instance-1
      domain: Storage
      weight: 8
      targetSeconds: 420
      difficulty: core
      docs:
        - label: Storage classes
          url: https://kubernetes.io/docs/concepts/storage/storage-classes/
        - label: Persistent volumes
          url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    - id: q24
      title: Rescue the retained PV
      instance: instance-2
      domain: Storage
      weight: 7
      targetSeconds: 600
      difficulty: deep
      docs:
        - label: Persistent volumes
          url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    - id: q25
      title: Dynamic provisioning
      instance: instance-1
      domain: Storage
      weight: 5
      targetSeconds: 210
      difficulty: quick
      docs:
        - label: Dynamic volume provisioning
          url: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/
        - label: Storage classes
          url: https://kubernetes.io/docs/concepts/storage/storage-classes/
    - id: q26
      title: etcd backup and restore
      instance: instance-2
      domain: Cluster Architecture, Installation and Configuration
      weight: 5
      targetSeconds: 780
      difficulty: deep
      docs:
        - label: Operating etcd clusters for Kubernetes
          url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
