apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: cka-mock-01
  title: CKA Mock Exam 01
  certification: CKA
  description: >-
    Administrator-track exercises: RBAC for a deployment service account
    and node-targeted scheduling. Two instances, kind-backed cluster.
spec:
  examType: hands-on
  duration: 120m
  passingScore: 66
  kubernetesVersion: "1.35"
  environment:
    provider: kind
    nodes: 2
    allowedDomains: [kubernetes.io, helm.sh, code.jquery.com, fonts.googleapis.com, fonts.gstatic.com, algolia.net, algolianet.com, gateway-api.sigs.k8s.io]
  instances:
    - name: instance-1
    - name: instance-2
  questions:
    - id: q01
      instance: instance-1
      domain: Servicing & Security (RBAC)
      weight: 6
    - id: q02
      instance: instance-2
      domain: Scheduling
      weight: 4
