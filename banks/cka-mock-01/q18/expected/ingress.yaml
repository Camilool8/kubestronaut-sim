apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-routes
  namespace: phoenix
spec:
  ingressClassName: nginx
  rules:
    - host: q18-phoenix.sim.local
      http:
        paths:
          - backend:
              service:
                name: api
                port:
                  number: 8080
            path: /api
            pathType: Prefix
          - backend:
              service:
                name: web
                port:
                  number: 80
            path: /web
            pathType: Prefix
