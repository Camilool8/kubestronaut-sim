apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: ckad-mock-01
  title: CKAD Mock Exam 01
  certification: CKAD
  description: >-
    Developer-track exercises across the full CKAD curriculum: workloads
    and multi-container design, deployments and configuration, security
    contexts, observability, and services, ingress and network policy.
    Two instances, kind-backed cluster.
spec:
  examType: hands-on
  duration: 120m
  passingScore: 66
  kubernetesVersion: "1.35"
  # The published CKAD curriculum weights. These are not documentation:
  # a domain's share of this exam's points IS its weight here, and
  # tests/bank-weights.sh fails the build if any domain drifts more than
  # 2 percentage points from it. Points are therefore derived — a
  # question is worth its domain's budget divided by the number of
  # questions in that domain — which is why adding a question to a
  # domain makes every question in it worth slightly less, and why the
  # balance cannot silently rot the way it did in milestone H.
  domainWeights:
    Application Design and Build: 20
    Application Deployment: 20
    Application Environment, Configuration and Security: 25
    Application Observability and Maintenance: 15
    Services and Networking: 20
  environment:
    provider: kind
    nodes: 2
    allowedDomains: [kubernetes.io, helm.sh, code.jquery.com, fonts.googleapis.com, fonts.gstatic.com, algolia.net, algolianet.com]
  instances:
    - name: instance-1
    - name: instance-2
  questions:
    - id: q01
      title: Namespaces & ResourceQuota
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 9
    - id: q02
      title: Fix a failing Deployment
      instance: instance-1
      domain: Application Deployment
      weight: 9
    - id: q03
      title: NetworkPolicy lockdown
      instance: instance-2
      domain: Services and Networking
      weight: 9
    - id: q04
      title: CronJob and Job
      instance: instance-2
      domain: Application Design and Build
      weight: 6
    - id: q05
      title: Init container and native sidecar
      instance: instance-1
      domain: Application Design and Build
      weight: 6
    - id: q06
      title: ConfigMaps, as env and as a volume
      instance: instance-2
      domain: Application Environment, Configuration and Security
      weight: 9
    - id: q07
      title: Lock down a Pod
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 9
    - id: q08
      title: Route two Services with one Ingress
      instance: instance-2
      domain: Services and Networking
      weight: 9
    - id: q09
      title: Build, push and run a container image
      instance: instance-1
      domain: Application Design and Build
      weight: 6
    - id: q10
      title: Persistent and ephemeral storage
      instance: instance-2
      domain: Application Design and Build
      weight: 6
    - id: q11
      title: Helm release management
      instance: instance-1
      domain: Application Deployment
      weight: 9
    - id: q12
      title: Roll out, then roll back
      instance: instance-2
      domain: Application Deployment
      weight: 9
    - id: q13
      title: Kustomize overlay
      instance: instance-1
      domain: Application Deployment
      weight: 9
    - id: q14
      title: Secrets, and a Deployment that cannot read one
      instance: instance-2
      domain: Application Environment, Configuration and Security
      weight: 9
    - id: q15
      title: ServiceAccounts and tokens
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 9
    - id: q16
      title: Health checks
      instance: instance-2
      domain: Application Observability and Maintenance
      weight: 9
    - id: q17
      title: Find out why two workloads are broken
      instance: instance-1
      domain: Application Observability and Maintenance
      weight: 9
    - id: q18
      title: Bring a manifest up to date
      instance: instance-2
      domain: Application Observability and Maintenance
      weight: 9
    - id: q19
      title: A Service that reaches nothing
      instance: instance-1
      domain: Services and Networking
      weight: 9
    - id: q20
      title: Expose a Deployment on a node port
      instance: instance-2
      domain: Services and Networking
      weight: 9
    - id: q21
      title: The adapter pattern
      instance: instance-1
      domain: Application Design and Build
      weight: 6
    - id: q22
      title: The ambassador pattern
      instance: instance-2
      domain: Application Design and Build
      weight: 6