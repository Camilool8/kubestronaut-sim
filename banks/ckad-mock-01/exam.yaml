apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: ckad-mock-01
  title: CKAD Mock Exam 01
  certification: CKAD
  description: >-
    Developer-track exercises across the full CKAD curriculum: workloads
    and multi-container design, deployments and configuration, security
    contexts, observability, and services, ingress and network policy.
    Two instances, kind-backed cluster.
spec:
  examType: hands-on
  duration: 120m
  passingScore: 66
  kubernetesVersion: "1.35"
  examLength: 22
  domainWeights:
    Application Design and Build: 20
    Application Deployment: 20
    Application Environment, Configuration and Security: 25
    Application Observability and Maintenance: 15
    Services and Networking: 20
  environment:
    provider: kind
    nodes: 2
    allowedDomains: [kubernetes.io, helm.sh, code.jquery.com, fonts.googleapis.com, fonts.gstatic.com, algolia.net, algolianet.com]
  instances:
    - name: instance-1
    - name: instance-2
  questions:
    - id: q01
      title: Namespaces & ResourceQuota
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 9
      docs:
        - label: Namespaces
          url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
        - label: Resource quotas
          url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
    - id: q02
      title: Fix a failing Deployment
      instance: instance-1
      domain: Application Deployment
      weight: 9
      docs:
        - label: Deployments
          url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - id: q03
      title: NetworkPolicy lockdown
      instance: instance-2
      domain: Services and Networking
      weight: 11
      docs:
        - label: Network policies
          url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    - id: q04
      title: CronJob and Job
      instance: instance-2
      domain: Application Design and Build
      weight: 6
      docs:
        - label: CronJob
          url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
        - label: Jobs
          url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
    - id: q05
      title: Init container and native sidecar
      instance: instance-1
      domain: Application Design and Build
      weight: 6
      docs:
        - label: Init containers
          url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
        - label: Sidecar containers
          url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
    - id: q06
      title: ConfigMaps, as env and as a volume
      instance: instance-2
      domain: Application Environment, Configuration and Security
      weight: 9
      docs:
        - label: ConfigMaps
          url: https://kubernetes.io/docs/concepts/configuration/configmap/
        - label: Configuring a Pod to use a ConfigMap
          url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
    - id: q07
      title: Lock down a Pod
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 9
      docs:
        - label: Security contexts
          url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    - id: q08
      title: Route two Services with one Ingress
      instance: instance-2
      domain: Services and Networking
      weight: 11
      docs:
        - label: Ingress
          url: https://kubernetes.io/docs/concepts/services-networking/ingress/
    - id: q09
      title: Build, push and run a container image
      instance: instance-1
      domain: Application Design and Build
      weight: 6
      docs:
        - label: Container images
          url: https://kubernetes.io/docs/concepts/containers/images/
    - id: q10
      title: Persistent and ephemeral storage
      instance: instance-2
      domain: Application Design and Build
      weight: 6
      docs:
        - label: Persistent volumes
          url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
        - label: Ephemeral volumes
          url: https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/
    - id: q11
      title: Helm release management
      instance: instance-1
      domain: Application Deployment
      weight: 9
    - id: q12
      title: Roll out, then roll back
      instance: instance-2
      domain: Application Deployment
      weight: 9
      docs:
        - label: Deployment rollouts and rollbacks
          url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - id: q13
      title: Kustomize overlay
      instance: instance-1
      domain: Application Deployment
      weight: 9
      docs:
        - label: Kustomize
          url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
    - id: q14
      title: Secrets, and a Deployment that cannot read one
      instance: instance-2
      domain: Application Environment, Configuration and Security
      weight: 9
      docs:
        - label: Secrets
          url: https://kubernetes.io/docs/concepts/configuration/secret/
    - id: q15
      title: ServiceAccounts and tokens
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 9
      docs:
        - label: ServiceAccounts for Pods
          url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
    - id: q16
      title: Health checks
      instance: instance-2
      domain: Application Observability and Maintenance
      weight: 8
      docs:
        - label: Liveness, readiness and startup probes
          url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    - id: q17
      title: Find out why two workloads are broken
      instance: instance-1
      domain: Application Observability and Maintenance
      weight: 8
    - id: q18
      title: Bring a manifest up to date
      instance: instance-2
      domain: Application Observability and Maintenance
      weight: 8
      docs:
        - label: Deprecated API migration guide
          url: https://kubernetes.io/docs/reference/using-api/deprecation-guide/
    - id: q19
      title: A Service that reaches nothing
      instance: instance-1
      domain: Services and Networking
      weight: 11
      docs:
        - label: Services
          url: https://kubernetes.io/docs/concepts/services-networking/service/
    - id: q20
      title: Expose a Deployment on a node port
      instance: instance-2
      domain: Services and Networking
      weight: 11
      docs:
        - label: Service types
          url: https://kubernetes.io/docs/concepts/services-networking/service/
    - id: q21
      title: The adapter pattern
      instance: instance-1
      domain: Application Design and Build
      weight: 6
    - id: q22
      title: The ambassador pattern
      instance: instance-2
      domain: Application Design and Build
      weight: 6
    - id: q23
      title: Blue/green cutover
      instance: instance-1
      domain: Application Deployment
      weight: 9
      docs:
        - label: Services
          url: https://kubernetes.io/docs/concepts/services-networking/service/
        - label: Labels and selectors
          url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
    - id: q24
      title: Replace a bare Pod with a hardened Deployment
      instance: instance-2
      domain: Application Environment, Configuration and Security
      weight: 9
      docs:
        - label: Security contexts
          url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        - label: Deployments
          url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - id: q25
      title: Debug a Pod you cannot get into
      instance: instance-1
      domain: Application Observability and Maintenance
      weight: 8
      docs:
        - label: Ephemeral containers
          url: https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/
        - label: Debug running Pods
          url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
    - id: q26
      title: Pull policy and shutdown budget
      instance: instance-2
      domain: Application Design and Build
      weight: 6
      docs:
        - label: Images and pull policy
          url: https://kubernetes.io/docs/concepts/containers/images/
        - label: Pod lifecycle
          url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
