apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: ckad-mock-01
  title: CKAD Mock Exam 01
  certification: CKAD
  description: >-
    Developer-track exercises: namespaces and quotas, debugging a broken
    Deployment, and NetworkPolicy lockdown. Two instances, kind-backed
    cluster.
spec:
  examType: hands-on
  duration: 120m
  passingScore: 66
  kubernetesVersion: "1.35"
  environment:
    provider: kind
    nodes: 2
    allowedDomains: [kubernetes.io, helm.sh]
  instances:
    - name: instance-1
    - name: instance-2
  questions:
    - id: q01
      instance: instance-1
      domain: Application Environment, Configuration and Security
      weight: 5
    - id: q02
      instance: instance-1
      domain: Application Deployment
      weight: 7
    - id: q03
      instance: instance-2
      domain: Services and Networking
      weight: 5
