apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: ckne-mock
  title: CKNE Mock Exam
  certification: CKNE
  description: >-
    Kubernetes networking end to end: CNI and IPAM, Services and DNS,
    Gateway API, NetworkPolicy and encryption, observability. 75 of 170
    questions each attempt, weighted to the five domains the Linux
    Foundation published, every answer explained, in seven languages.
    The real CKNE is hands-on; this bank drills the knowledge behind it.
spec:
  examType: mcq
  duration: 90m
  speedDuration: 45m
  passingScore: 66
  kubernetesVersion: "1.35"
  domainWeights:
    Core Infrastructure and CNI: 15
    Service Networking and DNS: 25
    Advanced Traffic Management: 20
    Network Security and Policy: 25
    Observability: 15
  examLength: 75
  language: en
  translations: [pt, es, de, fr, ru, ar]
  questions:
