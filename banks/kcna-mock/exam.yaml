      domain: Kubernetes Fundamentals
      multi: false
      options:
        - "The kubelet"
        - "The kube-scheduler"
        - "The kube-apiserver"
        - "The kube-controller-manager"
      correct: [2]
      docs:
        - label: Cluster components
          url: https://kubernetes.io/docs/concepts/overview/components/
    - id: q02
      domain: Kubernetes Fundamentals
      multi: false
      options:
        - "kube-proxy"
        - "The kubelet"
        - "The container runtime"
        - "The kube-controller-manager"
      correct: [1]
      docs:
