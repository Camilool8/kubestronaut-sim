apiVersion: sim.kubestronaut.dev/v1alpha2
kind: Exam
metadata:
  name: kcna-mock
  title: KCNA Mock Exam
  certification: KCNA
  description: >-
    65 questions drawn each attempt from a 97-question pool, in the real
    exam's shape: 90 minutes, 75% to pass, weighted across the four KCNA
    curriculum domains. Single-answer and select-all-that-apply items,
    each with a full explanation for review.
spec:
  examType: mcq
  duration: 90m
  speedDuration: 45m
  passingScore: 75
  kubernetesVersion: "1.35"
  domainWeights:
    Kubernetes Fundamentals: 44
    Container Orchestration: 28
    Cloud Native Application Delivery: 16
    Cloud Native Architecture: 12
  examLength: 65
  questions:
