name: kubestronaut-sim
services:
  k8s-env:
    build: images/k8s-env
    hostname: k8s-env
    privileged: true
    environment:
      BANK: ${BANK:-ckad-mock-01}
    volumes:
      - shared:/shared
      - dind:/var/lib/docker
      - ./banks:/banks:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/shared/ready"]
      interval: 10s
      timeout: 3s
      retries: 90
      start_period: 60s
    networks: [default, examnet]
  ckad-1:
    build: images/instance
    hostname: ckad-1
    environment:
      BANK: ${BANK:-ckad-mock-01}
    depends_on:
      k8s-env: {condition: service_healthy}
    volumes:
      - shared:/shared:ro
      - ./banks:/banks:ro
      - ./tests:/tests:ro
      - course-1:/opt/course
    networks: [default, examnet]
  ckad-2:
    build: images/instance
    hostname: ckad-2
    environment:
      BANK: ${BANK:-ckad-mock-01}
    depends_on:
      k8s-env: {condition: service_healthy}
    volumes:
      - shared:/shared:ro
      - ./banks:/banks:ro
      - ./tests:/tests:ro
      - course-2:/opt/course
    networks: [default, examnet]
  docs-proxy:
    build: proxy
    hostname: docs-proxy
    environment:
      BANK: ${BANK:-ckad-mock-01}
    volumes:
      - ./banks:/banks:ro
    networks: [default, examnet]
    restart: unless-stopped
  desktop:
    build: images/desktop
    hostname: desktop
    depends_on:
      k8s-env: {condition: service_healthy}
      docs-proxy: {condition: service_started}
    volumes:
      - shared:/shared:ro
    networks: [examnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6080/vnc.html"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
  facilitator:
    build:
      context: .
      dockerfile: facilitator/Dockerfile
    hostname: facilitator
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BANK: ${BANK:-ckad-mock-01}
      SESSION_DURATION_OVERRIDE: ${SESSION_DURATION_OVERRIDE:-}
    volumes:
      - ./banks:/banks:ro
      - shared:/shared:ro
      - session:/session
    networks: [examnet]
    depends_on:
      k8s-env: {condition: service_healthy}
      desktop: {condition: service_healthy}
      ckad-1: {condition: service_started}
      ckad-2: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
volumes:
  shared: {}
  dind: {}
  course-1: {}
  course-2: {}
  session: {}
networks:
  default: {}
  examnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_ip6_masquerade: "false"
