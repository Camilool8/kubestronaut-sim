name: kubestronaut-sim
services:
  k8s-env:
    build: images/k8s-env
    hostname: k8s-env
    privileged: true
    environment:
      BANK: ${BANK:-}
    ports:
      - "${SIM_BIND:-0.0.0.0}:8081:80"
      - "${SIM_BIND:-0.0.0.0}:8443:443"
      - "${SIM_BIND:-0.0.0.0}:30080-30082:30080-30082"
    volumes:
      - shared:/shared
      - dind:/var/lib/docker
      - ./banks:/banks:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/shared/ready"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 120s
      start_interval: 2s
    networks:
      default:
        priority: 100
      examnet:
        priority: 10
  instance-1:
    build: images/instance
    hostname: instance-1
    environment:
      BANK: ${BANK:-}
    volumes:
      - shared:/shared:ro
      - ./banks:/banks:ro
      - ./tests:/tests:ro
      - course-1:/opt/course
      - containers-1:/var/lib/containers
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_add: [SYS_ADMIN, SYS_CHROOT, MKNOD, SETFCAP, SYS_RESOURCE]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    devices: ["/dev/fuse"]
    cgroup: host
    networks: [default, examnet]
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /home/candidate/.kube/config && exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  instance-2:
    build: images/instance
    hostname: instance-2
    environment:
      BANK: ${BANK:-}
    volumes:
      - shared:/shared:ro
      - ./banks:/banks:ro
      - ./tests:/tests:ro
      - course-2:/opt/course
      - containers-2:/var/lib/containers
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_add: [SYS_ADMIN, SYS_CHROOT, MKNOD, SETFCAP, SYS_RESOURCE]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    devices: ["/dev/fuse"]
    cgroup: host
    networks: [default, examnet]
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /home/candidate/.kube/config && exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  registry:
    image: registry:2
    hostname: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry:/var/lib/registry
    networks: [examnet]
    restart: unless-stopped
  docs-proxy:
    build: proxy
    hostname: docs-proxy
    environment:
      BANK: ${BANK:-}
    volumes:
      - ./banks:/banks:ro
      - shared:/shared:ro
    networks: [default, examnet]
    restart: unless-stopped
  desktop:
    build: images/desktop
    hostname: desktop
    depends_on:
      docs-proxy: {condition: service_started}
    volumes:
      - shared:/shared:ro
    networks: [examnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6080/vnc.html"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
  conductor:
    build: conductor
    hostname: conductor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./banks:/banks:ro
      - shared:/shared
    networks: [controlnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
  facilitator:
    build:
      context: .
      dockerfile: facilitator/Dockerfile
    hostname: facilitator
    ports:
      - "${SIM_BIND:-0.0.0.0}:8080:8080"
    environment:
      BANK: ${BANK:-}
      SESSION_DURATION_OVERRIDE: ${SESSION_DURATION_OVERRIDE:-}
    volumes:
      - ./banks:/banks:ro
      - shared:/shared:ro
      - session:/session
      - state:/state
    networks: [examnet, controlnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
volumes:
  shared: {}
  dind: {}
  course-1: {}
  course-2: {}
  session: {}
  state: {}
  registry: {}
  containers-1: {}
  containers-2: {}
networks:
  default: {}
  examnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_ip6_masquerade: "false"
  controlnet:
    internal: true
