# Podman engine defaults for the exam instances.
#
# An instance is itself a container, so podman is running one level down
# from a cgroup hierarchy it does not own. Podman 5 asks crun to create a
# cgroup per container and enable the `pids` and `cpuset` controllers in
# it, and the delegation to do that is not there:
#
#   crun: controller `pids` is not available under /sys/fs/cgroup/libpod_parent/...
#
# Disabling cgroup creation is the right trade here. What it costs is
# podman's ability to *limit* a container's resources — which no question
# asks for, and which the kubelet handles for everything that actually
# runs in the cluster. What it buys is that `podman run` works with the
# plain command a candidate would type, instead of the question having to
# teach `--cgroups=disabled` as a workaround for our packaging.
[containers]
cgroups = "disabled"

# Podman's stock default_sysctls include net.ipv4.ping_group_range, which
# crun then writes into every container it creates — and /proc/sys is
# mounted read-only in an unprivileged container, so the write fails and
# takes the whole build step with it. Nothing in the exam needs
# unprivileged ICMP, so the default is cleared rather than the privilege
# granted.
default_sysctls = []

# Containers share the instance's network namespace instead of getting
# their own. Creating a namespace needs privileges these containers do
# not have ("setup network: opening network namespace: permission
# denied"), and nothing here wants an isolated network: a build step
# runs `chmod`, and the container a question starts prints a line and
# sleeps. Everything that needs real networking runs in the cluster,
# where the kubelet does it properly.
netns = "host"
