# Podman registry configuration for the exam instances.
#
# `podman build`/`podman run` are given the same short-name behaviour as
# docker (unqualified names resolve against Docker Hub) so a Dockerfile
# that says `FROM alpine:3.21` works without a candidate having to know
# podman's stricter default.
unqualified-search-registries = ["docker.io"]

# The exam registry: plain HTTP on the exam network, no auth, not
# reachable from outside the compose project. See images/instance/Dockerfile.
[[registry]]
location = "registry:5000"
insecure = true
