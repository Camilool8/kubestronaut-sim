# Podman container storage for the exam instances.
#
# vfs rather than overlay. An instance is itself a container, so stacking
# overlayfs on the overlayfs its own root filesystem already uses needs
# fuse-overlayfs as a mount program. That combination was measured and
# does work here — but it depends on /dev/fuse and on the FUSE stack
# behaving inside nested containers, and it buys nothing at the sizes
# involved: building the questions' deliberately tiny images took the
# same four seconds either way.
#
# vfs copies each layer in full instead of stacking them, so it is slower
# and hungrier for space on large images. Neither applies here, and
# "fewer moving parts" is worth more than "faster in a case we do not
# have" when a candidate is on a clock. Switch to overlay if a question
# ever needs a genuinely large base image.
[storage]
driver = "vfs"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
