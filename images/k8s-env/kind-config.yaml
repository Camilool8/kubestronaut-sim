kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sim
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - "k8s-env"
            - "localhost"
            - "127.0.0.1"
  - role: worker
