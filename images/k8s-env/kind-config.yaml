kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sim
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    # etcd's data dir defaults to the node's own root filesystem, which here is
    # overlay2-on-overlay2-on-overlay2 (host ext4 -> k3s containerd snapshot ->
    # k8s-env's own dind overlay2 -> this node's overlay2 root). Measured fsync
    # latency there: 24-250ms, against etcd's own >100ms "apply request took
    # too long" threshold — so any write burst (Calico's ~20 CRDs are exactly
    # that) queues up requests until one crosses etcd's client timeout and
    # `kubectl apply` fails with "etcdserver: request timed out". The data dir
    # is a directory on the dind volume instead, which is the host's own disk
    # locally and a disk-backed emptyDir hosted: no overlay in either, measured
    # ~3ms per sync write. It used to be a tmpfs, faster still, but a tmpfs did
    # not outlive the k8s-env container, while the node containers in the dind
    # volume did — so every `./sim down` / `./sim up` resumed the nodes onto an
    # empty etcd: a brand-new cluster with the old certificates and no RBAC,
    # where even kubernetes-admin was Forbidden. On the volume, etcd's data
    # lives and dies with the nodes it belongs to.
    extraMounts:
      - hostPath: /var/lib/docker/sim-etcd
        containerPath: /var/lib/etcd-data
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - "k8s-env"
            - "localhost"
            - "127.0.0.1"
        etcd:
          local:
            dataDir: /var/lib/etcd-data
    extraPortMappings:
      # Node ssh (CKA contract port table): 2200 is the control plane; workers
      # get 2201+ appended by bootstrap.sh as it adds worker entries. Present
      # for every bank — the node image runs sshd either way, and an unused
      # mapping costs nothing.
      - containerPort: 22
        hostPort: 2200
        protocol: TCP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
      - containerPort: 30082
        hostPort: 30082
        protocol: TCP
