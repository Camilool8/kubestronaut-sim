<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>og.png source — kubestronaut-sim</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html, body { margin: 0; padding: 0; background: var(--bg); }
      .og {
        box-sizing: border-box; width: 1200px; height: 630px;
        position: relative; overflow: hidden;
        display: flex; flex-direction: column; justify-content: center;
        padding: 72px 76px; background: var(--bg);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .og-stars { position: absolute; inset: 0; fill: var(--star); }
      .og-orbit { position: absolute; top: -95px; right: -420px; width: 1280px; height: auto; z-index: 0; }
      .og-mark, .og-title, .og-desc, .og-chips { position: relative; z-index: 1; }
      .og-mark { display: flex; align-items: center; gap: 12px;
        font-size: 26px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }
      .og-mark span { color: var(--secondary); }
      .og-title { margin: 30px 0 0; max-width: 17ch; font-size: 62px; line-height: 1.06;
        font-weight: 600; letter-spacing: -0.025em; color: var(--text); text-wrap: balance; }
      .og-desc { margin: 26px 0 0; max-width: 52ch; font-size: 23px; line-height: 1.5;
        color: var(--secondary); }
      .og-chips { display: flex; gap: 12px; margin: 34px 0 0; }
      .og-chip { display: inline-flex; align-items: center; gap: 9px;
        font: 600 15px "IBM Plex Mono", monospace; letter-spacing: 0.05em;
        color: var(--text); background: var(--surface);
        border: 1px solid var(--border); border-radius: 999px; padding: 10px 18px; }
      .og-chip b { color: var(--success); font-weight: 600; }
      .og-chip.soon { color: var(--muted); }
      .og-chip .cert-mark { width: 18px; height: 18px; }
    </style>
  </head>
  <body>
    <div class="og">
      <svg class="og-stars" viewBox="0 0 1200 630" aria-hidden="true">
        <circle cx="80" cy="90" r="1.4"/><circle cx="310" cy="40" r="1"/>
        <circle cx="540" cy="120" r="1.6"/><circle cx="760" cy="60" r="1"/>
        <circle cx="980" cy="140" r="1.4"/><circle cx="1130" cy="70" r="1"/>
        <circle cx="180" cy="300" r="1"/><circle cx="1050" cy="330" r="1.6"/>
        <circle cx="880" cy="480" r="1"/><circle cx="120" cy="520" r="1.4"/>
        <circle cx="420" cy="580" r="1"/><circle cx="700" cy="540" r="1.2"/>
        <circle cx="200" cy="150" r="1"/><circle cx="450" cy="70" r="1.3"/>
        <circle cx="900" cy="90" r="1.5"/><circle cx="60" cy="380" r="1.2"/>
        <circle cx="960" cy="560" r="1.4"/><circle cx="300" cy="470" r="1"/>
      </svg>
      <img class="og-orbit" src="og-orbit.svg" alt="" width="1280" height="789" />
      <div class="og-mark">
        <img src="favicon.svg" alt="" width="30" height="30" />
        kubestronaut<span>-sim</span>
      </div>
      <h1 class="og-title">Rehearse the Kubernetes exams on a real cluster.</h1>
      <p class="og-desc">A timed sitting, a real Linux desktop, and a score graded
        on what your cluster actually does — on your own machine, no account.</p>
      <div class="og-chips">
        <span class="og-chip">CKAD <b>LIVE</b></span>
        <span class="og-chip">KCNA <b>LIVE</b></span>
        <span class="og-chip soon">CKA · KCSA · CKS soon</span>
      </div>
    </div>
  </body>
</html>
